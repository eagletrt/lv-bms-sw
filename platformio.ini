[platformio]
src_dir = .
include_dir = .
test_dir = Core/Test
default_envs = release
  
[env:release]
platform = ststm32
platform_packages = 
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200
extra_scripts = pre:scripts/build_script.py

board = stm32c092cct6
board_build.ldscript = STM32C092XX_FLASH.ld

upload_protocol = custom
upload_command = STM32_Programmer_CLI -c port=SWD mode=Normal -d "$BUILD_DIR/firmware.elf" -v -rst

build_flags = 
    -D_XOPEN_SOURCE
    -DUSE_HAL_DRIVER
    -std=gnu23
    -lm
    -ICore/Inc
    -ICore/Inc/common/
    -ICore/Inc/bms/can-communication/
    -ICore/Inc/bms/current/
    -ICore/Inc/bms/feedback/
    -ICore/Inc/bms/fsm/
    -ICore/Inc/bms/identity/
    -ICore/Inc/bms/monitor/
    -ICore/Inc/bms/post/
    -ICore/Inc/bms/temperature/
    -ICore/Inc/bms/voltage/
    -ICore/Inc/bms/logger/
    -IDrivers/CMSIS/Include/
    -IDrivers/STM32C0xx_HAL_Driver/Inc/
    -IDrivers/STM32H7xx_HAL_Driver/Inc/Legacy/
    -IDrivers/CMSIS/Device/ST/STM32C0xx/Include/
build_src_filter =
    +<Core/Src/>
    +<Drivers/STM32C0xx_HAL_Driver/Src/>
    -<Drivers/STM32C0xx_HAL_Driver/Src/*_template.c>
    +<./startup_stm32c092xx.s>
lib_deps =
    https://github.com/eagletrt/libbms-monitor-sw#dev
    https://github.com/eagletrt/libeagletrt-sw#v0.1.0
    https://github.com/eagletrt/libpal-sw.git#v0.1.0
    https://github.com/eagletrt/libcan-sw.git#master
    # https://github.com/eagletrt/libspec-sw#v1.0.0

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*Core/(Inc|Src)/.+/[^/]+\.(c|h)$
    clangtidy: --system-headers=false
check_src_filters =
    -<**>
    +<Core/Src/bms>
    +<Core/Inc/bms>

[env:tests]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -std=gnu23
    -D_XOPEN_SOURCE
    -DEAGLETRT_STATIC=
    -lm
    -ICore/Test/include/
    -ICore/Inc/common/
    -ICore/Inc/bms/monitor
    -ICore/Inc/bms/can-communication/
    -ICore/Inc/bms/current/
    -ICore/Inc/bms/feedback/
    -ICore/Inc/bms/identity/
    -ICore/Inc/bms/temperature/
    -ICore/Inc/bms/voltage/
    -ICore/Inc/bms/logger/
build_src_filter =
    +<Core/Src/bms/monitor>
    +<Core/Src/bms/can-communication/>
    +<Core/Src/bms/current/>
    +<Core/Src/bms/feedback/>
    +<Core/Src/bms/identity/>
    +<Core/Src/bms/temperature/>
    +<Core/Src/bms/voltage/>
    +<Core/Src/bms/logger/>
lib_deps =
    https://github.com/eagletrt/libbms-monitor-sw#dev
    https://github.com/eagletrt/libeagletrt-sw#v0.1.0
    https://github.com/eagletrt/libpal-sw.git#v0.1.0
    https://github.com/eagletrt/libcan-sw.git#master
